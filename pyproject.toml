[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-incident-ops"
version = "0.1.0"
description = "Google Cloud Rapid Agent Hackathon MVP for agentic incident operations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AegisOps Hackathon Team"}]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "google-genai>=1.0.0",
  "mcp>=1.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
automation = ["playwright>=1.45.0"]

[project.scripts]
incident-ops-agent = "agentic_incident_ops.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
